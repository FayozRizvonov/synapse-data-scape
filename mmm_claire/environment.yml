name: mmm_cl
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # ── Bayesian MMM core ────────────────────────────────────────────────────────
  - pymc>=5.25.1
  - pytensor>=2.31
  - arviz>=0.23
  # ── Numerics ─────────────────────────────────────────────────────────────────
  - numpy>=2.0
  - pandas>=2.3
  - scipy>=1.15
  - xarray>=2025.6
  - xarray-einstats>=0.8
  - h5py
  - h5netcdf
  # ── Visualisation (optional, used by diagnostics) ────────────────────────────
  - matplotlib-base>=3.10
  - graphviz
  - python-graphviz
  # ── Utilities ─────────────────────────────────────────────────────────────────
  - python-dateutil
  - pytz
  - cloudpickle
  - threadpoolctl
  - rich
  - pip
  # ── Async worker + Supabase (installed via pip) ───────────────────────────────
  - pip:
    - celery[redis]>=5.3.0
    - redis>=5.0.0
    - supabase>=2.0.0
    - python-dotenv>=1.0.0
